groups:

  - name: cloud-monitoring-alerts

    rules:

      # --------------------------------
      # VM DOWN
      # --------------------------------

      - alert: InstanceDown

        expr: up{job="node-exporter"} == 0

        for: 1m

        labels:
          severity: critical

        annotations:
          summary: "Monitoring target is down"
          description: "Node Exporter on {{ $labels.instance }} is not responding."


      # --------------------------------
      # HIGH CPU
      # --------------------------------

      - alert: HighCPUUsage

        expr: |
          100 -
          (
            avg by(instance)
            (
              rate(node_cpu_seconds_total{
                job="node-exporter",
                mode="idle"
              }[5m])
            ) * 100
          ) > 80

        for: 5m

        labels:
          severity: warning

        annotations:
          summary: "High CPU usage"
          description: "CPU usage on {{ $labels.instance }} is above 80%."


      # --------------------------------
      # HIGH MEMORY
      # --------------------------------

      - alert: HighMemoryUsage

        expr: |
          (
            1 -
            (
              node_memory_MemAvailable_bytes{
                job="node-exporter"
              }
              /
              node_memory_MemTotal_bytes{
                job="node-exporter"
              }
            )
          ) * 100 > 80

        for: 5m

        labels:
          severity: warning

        annotations:
          summary: "High memory usage"
          description: "Memory usage on {{ $labels.instance }} is above 80%."


      # --------------------------------
      # LOW DISK SPACE
      # --------------------------------

      - alert: LowDiskSpace

        expr: |
          (
            1 -
            (
              node_filesystem_avail_bytes{
                job="node-exporter",
                mountpoint="/",
                fstype!~"tmpfs|overlay"
              }
              /
              node_filesystem_size_bytes{
                job="node-exporter",
                mountpoint="/",
                fstype!~"tmpfs|overlay"
              }
            )
          ) * 100 > 85

        for: 5m

        labels:
          severity: warning

        annotations:
          summary: "Low disk space"
          description: "Root filesystem usage on {{ $labels.instance }} is above 85%."
