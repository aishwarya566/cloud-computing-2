global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:

  # Prometheus itself
  - job_name: "prometheus"

    static_configs:
      - targets:
          - "prometheus:9090"


  # Azure VM system metrics
  - job_name: "node-exporter"

    static_configs:
      - targets:
          - "node-exporter:9100"
